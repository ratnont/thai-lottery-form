<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Thai Lottery Form</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=TH+Sarabun+New&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    body {
      font-family: 'TH Sarabun New', sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #f7f7f7;
    }
    .controls {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    label {
      font-size: 18px;
    }
    input, select, button {
      font-size: 18px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .tables {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(3, auto);
      gap: 0;
      margin-bottom: 20px;
    }
    .table-wrapper {
      background: white;
      border: 2px solid #ccc;
      padding: 10px;
      border-radius: 1px;
    }
    .lottery-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .lottery-column {
      display: grid;
      grid-template-rows: repeat(10, auto);
      gap: 4px;
    }
    .lottery-row {
      display: flex;
      align-items: center;
    }
    .row-number {
      width: 20px;
      text-align: right;
      margin-right: 4px;
      font-size: 10px;
      color: #888;
    }
    .cell {
      border: 1px solid black;
      width: 20px;
      height: 20px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      margin-right: -1px;
      background-color: #fff;
    }
    .gap-after-2 {
      margin-right: 10px !important;
    }
    .footer {
      font-size: 16px;
      margin-top: 8px;
      padding: 5px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      align-items: center;
    }
    .footer-align-left {
      margin-left: 20px;
      margin-right: 0px;
      white-space: nowrap;
    }
    .footer-align-prize {
      margin-left: -80px;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .footer-right {
      white-space: nowrap;
      min-width: 100px;
      text-align: right;
    }
    .footer-center {
      margin-top: 4px;
      margin-left: 24px;
      font-size: 16px;
    }
    .qr-section {
      max-width: 400px;
    }
    #qr-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 200px;
      height: 200px;
      border: 3px solid #00e676;
      border-radius: 6px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.45);
      pointer-events: none;
    }
    #qr-status {
      font-size: 15px;
      margin-top: 6px;
      min-height: 22px;
      color: #555;
    }
    #qr-status.success { color: #28a745; font-weight: bold; }
    #qr-status.error   { color: #dc3545; }
    .bottom-controls {
      text-align: center;
      margin-top: 20px;
    }
    .cell.duplicate {
      animation: flash-red 1.5s ease-out forwards;
    }
    @keyframes flash-red {
      0%   { background-color: #ff4444; color: white; }
      60%  { background-color: #ffaaaa; color: black; }
      100% { background-color: #fff;    color: black; }
    }
    #toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 9999;
      white-space: nowrap;
    }
    #toast.show {
      opacity: 1;
    }
    @media print {
      .no-print {
        display: none;
      }
      .table-wrapper {
        display: block !important;
      }
      .footer-right {
        display: inline !important;
        visibility: visible !important;
      }
      @page {
        size: A4 portrait;
        margin-left: 15px;
		margin-right: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="controls no-print">
    <label>ชื่อเจ้าของ:</label>
    <input type="text" id="ownerName" placeholder="ชื่อ นามสกุล" list="ownerPresets" />
    <datalist id="ownerPresets">
      <option value="รัชนนท์ พงษ์สิทธิถาวร" />
    </datalist>
    <label>เลือกตารางที่ต้องการกรอก QR:</label>
    <select id="activeTableSelect" onchange="setActiveTable(this.value)">
      <option value="0">ตารางที่ 1</option>
      <option value="1">ตารางที่ 2</option>
      <option value="2">ตารางที่ 3</option>
      <option value="3">ตารางที่ 4</option>
      <option value="4">ตารางที่ 5</option>
      <option value="5">ตารางที่ 6</option>
    </select>
    <div class="qr-section">
      <button id="qrToggleBtn" onclick="toggleQRScanner()">เริ่มสแกน QR</button>
      <div id="qr-container" style="display:none; position:relative; max-width:300px; margin-top:8px;">
        <video id="qr-video" playsinline style="width:100%; border-radius:8px; display:block;"></video>
        <canvas id="qr-canvas" style="display:none;"></canvas>
        <div id="qr-overlay"></div>
      </div>
      <div id="qr-status"></div>
    </div>
    <div>
      <label>กรอกเลข:</label>
      <input type="tel" id="manualSet" placeholder="ชุดที่" maxlength="2" style="width:40px;" />
      <input type="tel" id="manualNumber" placeholder="เลขสลาก" maxlength="6" style="width:120px;" />
      <button onclick="manualInputQR()">เพิ่ม</button>
      <button onclick="undoLastEntry()">ย้อนกลับ</button>
    </div>
  </div>
  <div id="toast"></div>
  <div class="tables" id="tablesContainer"></div>
  <div class="bottom-controls no-print">
    <button onclick="window.print()">พิมพ์</button>
    <button onclick="clearState()" style="background-color:#dc3545; margin-left:10px;">ล้างข้อมูลทั้งหมด</button>
  </div>
  <script>
    const prizeOptions = ["None", "ข้างเคียงรางวัลที่ 1", "รางวัลที่ 2", "รางวัลที่ 3", "รางวัลที่ 4", "รางวัลที่ 5", "หน้า 3 ตัว", "ท้าย 3 ตัว", "ท้าย 2 ตัว", "หน้า 3 ตัว+ท้าย 3 ตัว", "หน้า 3 ตัว+ท้าย 2 ตัว", "ท้าย 3 ตัว+ท้าย 2 ตัว"];
    const lotteryOptions = ["None", "รัฐบาล", "การกุศล"];
    let currentTableIndex = 0;
    let tableRowsFilled = Array(6).fill(0);
    let ticketMap = new Map(); // ticketCode -> { table, row }
    let entryHistory = [];

    function setActiveTable(index) {
      currentTableIndex = parseInt(index);
      document.querySelectorAll('.table-wrapper').forEach((el, i) => {
        el.style.display = i === currentTableIndex ? 'block' : 'none';
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toast._hideTimer);
      toast._hideTimer = setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function highlightDuplicate(table, row) {
      for (let c = 0; c < 8; c++) {
        const cell = document.querySelector(`[data-cell="${table}-${row}-${c}"]`);
        if (!cell) continue;
        cell.classList.remove('duplicate');
        void cell.offsetWidth; // force reflow to restart animation
        cell.classList.add('duplicate');
      }
    }

    function fillTableFromParts(cc, dddddd) {
      const ticketCode = `${cc}-${dddddd}`;
      if (ticketMap.has(ticketCode)) {
        const { table, row } = ticketMap.get(ticketCode);
        showToast(`ซ้ำ! ${ticketCode} อยู่ที่ ตารางที่ ${table + 1} แถวที่ ${row + 1}`);
        setActiveTable(table);
        document.getElementById('activeTableSelect').value = table;
        highlightDuplicate(table, row);
        return;
      }
      const row = tableRowsFilled[currentTableIndex];
      if (row >= 20) { alert("ตารางนี้ครบแล้ว"); return; }
      for (let i = 0; i < 2; i++) {
        document.querySelector(`[data-cell="${currentTableIndex}-${row}-${i}"]`).textContent = cc[i] || '';
      }
      for (let i = 0; i < 6; i++) {
        document.querySelector(`[data-cell="${currentTableIndex}-${row}-${i+2}"]`).textContent = dddddd[i] || '';
      }
      ticketMap.set(ticketCode, { table: currentTableIndex, row });
      entryHistory.push({ table: currentTableIndex, row, ticketCode });
      tableRowsFilled[currentTableIndex]++;
      updateFooter(currentTableIndex);
      saveState();
    }

    function manualInputQR() {
      const cc = document.getElementById("manualSet").value.trim();
      const dddddd = document.getElementById("manualNumber").value.trim();
      if (!/^\d{2}$/.test(cc)) { alert("กรุณากรอกชุดที่ให้ถูกต้อง (2 หลัก)"); return; }
      if (!/^\d{6}$/.test(dddddd)) { alert("กรุณากรอกเลขสลากให้ถูกต้อง (6 หลัก)"); return; }
      fillTableFromParts(cc, dddddd);
      document.getElementById("manualSet").value = "";
      document.getElementById("manualNumber").value = "";
      document.getElementById("manualSet").focus();
    }

    function undoLastEntry() {
      const last = entryHistory.pop();
      if (!last) return alert("ยังไม่มีข้อมูลให้ย้อนกลับ");
      for (let c = 0; c < 8; c++) {
        const cell = document.querySelector(`[data-cell="${last.table}-${last.row}-${c}"]`);
        if (cell) cell.textContent = '';
      }
      ticketMap.delete(last.ticketCode);
      tableRowsFilled[last.table]--;
      updateFooter(last.table);
      saveState();
    }

    function saveState() {
      const state = {
        ownerName: document.getElementById('ownerName').value,
        tableRowsFilled,
        ticketMap: [...ticketMap.entries()],
        entryHistory,
        tables: []
      };
      for (let t = 0; t < 6; t++) {
        const cells = [];
        for (let row = 0; row < 20; row++) {
          const rowData = [];
          for (let c = 0; c < 8; c++) {
            const cell = document.querySelector(`[data-cell="${t}-${row}-${c}"]`);
            rowData.push(cell ? cell.textContent : '');
          }
          cells.push(rowData);
        }
        state.tables.push({
          lotteryType: document.getElementById(`lottery-${t}`).value,
          prizeType: document.getElementById(`prize-${t}`).value,
          cells
        });
      }
      localStorage.setItem('thaiLotteryState', JSON.stringify(state));
    }

    function loadState() {
      const raw = localStorage.getItem('thaiLotteryState');
      if (!raw) return;
      const state = JSON.parse(raw);
      document.getElementById('ownerName').value = state.ownerName || '';
      tableRowsFilled = state.tableRowsFilled || Array(6).fill(0);
      ticketMap = new Map(state.ticketMap || []);
      entryHistory = state.entryHistory || [];
      for (let t = 0; t < 6; t++) {
        const tableData = state.tables[t];
        if (!tableData) continue;
        document.getElementById(`lottery-${t}`).value = tableData.lotteryType || '';
        document.getElementById(`prize-${t}`).value = tableData.prizeType || '';
        for (let row = 0; row < 20; row++) {
          for (let c = 0; c < 8; c++) {
            const cell = document.querySelector(`[data-cell="${t}-${row}-${c}"]`);
            if (cell && tableData.cells[row]) cell.textContent = tableData.cells[row][c] || '';
          }
        }
        updateFooter(t);
      }
    }

    function clearState() {
      if (!confirm("ล้างข้อมูลทั้งหมด?")) return;
      localStorage.removeItem('thaiLotteryState');
      location.reload();
    }

    let qrScanning = false;
    let qrStream = null;
    let qrAnimFrame = null;
    let lastScannedCode = null;
    let lastScannedTime = 0;
    let barcodeDetector = null;

    // Prefer native BarcodeDetector (supports Data Matrix on Chrome/Android)
    // Fall back to jsQR (QR codes only) on unsupported browsers
    if ('BarcodeDetector' in window) {
      BarcodeDetector.getSupportedFormats().then(formats => {
        const wanted = ['data_matrix', 'qr_code', 'aztec'].filter(f => formats.includes(f));
        barcodeDetector = new BarcodeDetector({ formats: wanted.length ? wanted : ['qr_code'] });
      });
    }

    function toggleQRScanner() {
      qrScanning ? stopQRScanner() : startQRScanner();
    }

    function startQRScanner() {
      const btn = document.getElementById('qrToggleBtn');
      const status = document.getElementById('qr-status');
      const container = document.getElementById('qr-container');
      const video = document.getElementById('qr-video');

      status.textContent = 'กำลังเปิดกล้อง...';
      status.className = '';
      btn.disabled = true;

      navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' } }
      }).then(stream => {
        qrStream = stream;
        video.srcObject = stream;
        container.style.display = 'block';
        return video.play();
      }).then(() => {
        qrScanning = true;
        btn.disabled = false;
        btn.textContent = 'หยุดสแกน QR';
        btn.style.backgroundColor = '#dc3545';
        const engine = barcodeDetector ? 'BarcodeDetector' : 'jsQR';
        status.textContent = `พร้อมสแกน (${engine}) — จ่อกล้องที่บาร์โค้ดบนสลาก`;
        scanLoop();
      }).catch(err => {
        btn.disabled = false;
        status.textContent = 'ไม่สามารถเปิดกล้องได้: ' + err.message;
        status.className = 'error';
      });
    }

    function scanLoop() {
      if (!qrScanning) return;
      const video = document.getElementById('qr-video');

      if (barcodeDetector) {
        // Native path: handles Data Matrix + QR codes
        barcodeDetector.detect(video)
          .then(barcodes => {
            if (barcodes.length > 0) onRawCode(barcodes[0].rawValue);
          })
          .catch(() => {})
          .finally(() => { if (qrScanning) qrAnimFrame = requestAnimationFrame(scanLoop); });
      } else {
        // jsQR fallback: QR codes only
        const canvas = document.getElementById('qr-canvas');
        const ctx = canvas.getContext('2d');
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0);
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = jsQR(imageData.data, imageData.width, imageData.height);
          if (code) onRawCode(code.data);
        }
        qrAnimFrame = requestAnimationFrame(scanLoop);
      }
    }

    function onRawCode(raw) {
      const now = Date.now();
      if (raw === lastScannedCode && now - lastScannedTime < 3000) return;
      lastScannedCode = raw;
      lastScannedTime = now;

      const status = document.getElementById('qr-status');
      let cc = null, num = null;

      // Format 1 — original: XXXX-XX-CC-NNNNNN-XX (5 dash parts)
      const parts = raw.split('-');
      if (parts.length === 5 && /^\d{2}$/.test(parts[2]) && /^\d{6}$/.test(parts[3])) {
        cc = parts[2]; num = parts[3];
      }

      // Format 2 — try any CC-NNNNNN pattern in the string
      if (!cc) {
        const m = raw.match(/\b(\d{2})-(\d{6})\b/);
        if (m) { cc = m[1]; num = m[2]; }
      }

      // Format 3 — try extracting 2-digit then 6-digit numbers from all digit groups
      if (!cc) {
        const digits = raw.match(/\d+/g) || [];
        const two = digits.find(d => d.length === 2);
        const six = digits.find(d => d.length === 6);
        if (two && six) { cc = two; num = six; }
      }

      if (!cc || !num) {
        // Show raw content so we can diagnose the real format
        status.textContent = `พบบาร์โค้ด (ไม่รู้จักรูปแบบ): ${raw}`;
        status.className = 'error';
        return;
      }

      const prevCount = tableRowsFilled[currentTableIndex];
      fillTableFromParts(cc, num);

      if (tableRowsFilled[currentTableIndex] > prevCount) {
        status.textContent = `✓ บันทึกแล้ว: ${cc}-${num} (ตารางที่ ${currentTableIndex + 1} แถวที่ ${prevCount + 1})`;
        status.className = 'success';
        if (tableRowsFilled[currentTableIndex] >= 20) {
          const next = currentTableIndex + 1;
          if (next < 6) {
            setActiveTable(next);
            document.getElementById('activeTableSelect').value = next;
            status.textContent += ` — ย้ายไปตารางที่ ${next + 1}`;
          } else {
            stopQRScanner();
            status.textContent = 'ครบทุกตารางแล้ว!';
          }
        }
      }
    }

    function stopQRScanner() {
      qrScanning = false;
      cancelAnimationFrame(qrAnimFrame);
      qrAnimFrame = null;
      if (qrStream) {
        qrStream.getTracks().forEach(t => t.stop());
        qrStream = null;
      }
      const video = document.getElementById('qr-video');
      video.srcObject = null;
      document.getElementById('qr-container').style.display = 'none';
      const btn = document.getElementById('qrToggleBtn');
      btn.textContent = 'เริ่มสแกน QR';
      btn.style.backgroundColor = '';
      const status = document.getElementById('qr-status');
      status.textContent = '';
      status.className = '';
    }

    function createTables() {
      const container = document.getElementById('tablesContainer');
      for (let t = 0; t < 6; t++) {
        const wrapper = document.createElement('div');
        wrapper.className = 'table-wrapper';

        const lotterySelect = document.createElement('select');
        lotterySelect.id = `lottery-${t}`;
        lotterySelect.classList.add('no-print');
        lotteryOptions.forEach((opt, idx) => {
          const o = document.createElement('option');
          o.value = opt === "None" ? "" : opt;
          o.textContent = opt;
          if (idx === 0) o.selected = true;
          lotterySelect.appendChild(o);
        });

        const prizeSelect = document.createElement('select');
        prizeSelect.id = `prize-${t}`;
        prizeSelect.classList.add('no-print');
        prizeOptions.forEach((opt, idx) => {
          const o = document.createElement('option');
          o.value = opt === "None" ? "" : opt;
          o.textContent = opt;
          if (idx === 0) o.selected = true;
          prizeSelect.appendChild(o);
        });

        const grid = document.createElement('div');
        grid.className = 'lottery-grid';
        for (let col = 0; col < 2; col++) {
          const column = document.createElement('div');
          column.className = 'lottery-column';
          for (let row = 0; row < 10; row++) {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'lottery-row';
            const index = col * 10 + row;
            const rowNum = document.createElement('div');
            rowNum.className = 'row-number';
            rowNum.textContent = index + 1;
            rowDiv.appendChild(rowNum);
            for (let c = 0; c < 8; c++) {
              const cell = document.createElement('div');
              cell.className = 'cell';
              if (c === 1) cell.classList.add('gap-after-2');
              cell.setAttribute('data-cell', `${t}-${index}-${c}`);
              rowDiv.appendChild(cell);
            }
            column.appendChild(rowDiv);
          }
          grid.appendChild(column);
        }

        const footer = document.createElement('div');
        footer.className = 'footer';
        footer.innerHTML = `<span class="footer-align-left" id="lottery-type-${t}"></span><span class="footer-align-prize" id="prize-type-${t}"></span><span class="footer-right" id="footer-total-${t}"></span>`;

        const footerCenter = document.createElement('div');
        footerCenter.className = 'footer-center';
        footerCenter.innerHTML = `ชื่อ <span id="owner-${t}"></span>`;

        prizeSelect.onchange = () => { updateFooter(t); saveState(); };
        lotterySelect.onchange = () => { updateFooter(t); saveState(); };

        wrapper.appendChild(grid);
        wrapper.appendChild(lotterySelect);
        wrapper.appendChild(prizeSelect);
        wrapper.appendChild(footer);
        wrapper.appendChild(footerCenter);
        wrapper.style.display = t === 0 ? 'block' : 'none';
        container.appendChild(wrapper);
      }
    }

    function updateFooter(index) {
      const name = document.getElementById('ownerName').value;
      document.getElementById(`owner-${index}`).textContent = name;
      document.getElementById(`prize-type-${index}`).textContent = document.getElementById(`prize-${index}`).value;
      document.getElementById(`lottery-type-${index}`).textContent = document.getElementById(`lottery-${index}`).value;
      const total = tableRowsFilled[index];
      const footerElement = document.getElementById(`footer-total-${index}`);
      if (total === 0) {
        footerElement.innerHTML = `รวม <span style="display:inline-block; width:20px;"></span> ชุด`;
      } else {
        footerElement.textContent = `รวม ${total} ชุด`;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      createTables();
      loadState();
      for (let i = 0; i < 6; i++) updateFooter(i);

      document.getElementById('ownerName').addEventListener('input', () => {
        for (let i = 0; i < 6; i++) updateFooter(i);
        saveState();
      });

      document.getElementById("manualNumber").addEventListener("keydown", e => {
        if (e.key === "Enter") manualInputQR();
      });
      document.getElementById("manualSet").addEventListener("keydown", e => {
        if (e.key === "Enter") document.getElementById("manualNumber").focus();
      });
    });
  </script>
</body>
</html>
